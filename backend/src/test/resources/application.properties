# =============================================================================
# Propzy Test Configuration
# =============================================================================

spring.application.name=propzy-backend

# H2 in-memory database with PostgreSQL compatibility mode for unit/fast tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema auto-creation for H2-based unit tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Flyway is enabled selectively during PostgreSQL Testcontainers integration testing
spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT – dummy Base64-encoded 256-bit key (DO NOT use in production)
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1wcm9wenktZGV2LW9ubHktMTIzNDU2Nzg5MA==
app.jwt.expiration-ms=600000
